<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Rounded Rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Central Glow -->
  <circle cx="256" cy="240" r="160" fill="#38bdf8" opacity="0.15" />

  <!-- Passport Badge Graphic -->
  <g filter="url(#shadow)">
    <!-- Passport booklet base -->
    <rect x="156" y="110" width="200" height="260" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <line x1="176" y1="110" x2="176" y2="370" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
    
    <!-- Sunburst Emblem on Booklet -->
    <circle cx="256" cy="210" r="46" fill="#f59e0b" opacity="0.9" />
    <circle cx="256" cy="210" r="32" fill="#dc2626" />
    <circle cx="256" cy="210" r="18" fill="#16a34a" />

    <!-- Car Silhouette on Passport -->
    <path d="M 200 310 L 220 280 L 292 280 L 312 310 L 322 310 Q 326 310 326 316 L 326 332 Q 326 336 322 336 L 316 336 Q 316 348 304 348 Q 292 348 292 336 L 220 336 Q 220 348 208 348 Q 196 348 196 336 L 190 336 Q 186 336 186 332 L 186 316 Q 186 310 190 310 Z" fill="#ffffff" />
    <circle cx="208" cy="336" r="6" fill="#0f172a" />
    <circle cx="304" cy="336" r="6" fill="#0f172a" />
  </g>

  <!-- Bottom Kurdish Label Badge -->
  <g filter="url(#shadow)">
    <rect x="106" y="395" width="300" height="65" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="256" y="438" font-family="'Vazirmatn', 'Arial', sans-serif" font-size="24" font-weight="900" fill="#f0f9ff" text-anchor="middle" letter-spacing="1">گومرگی سلێمانی</text>
  </g>
</svg>

